name: CI
on: [push, pull_request]
permissions: {contents: read}
jobs:
  testes:
    name: Testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: {dotnet-version: "8.0.x"}
      - run: dotnet build Api
      - run: dotnet run --project Testes
