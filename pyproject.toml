[project]
name = "circulo"
version = "1.71.0"
description = "Círculo autoevolutivo Jev First — controle financeiro da família"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
metricas = ["prometheus_client>=0.17"]
dev = ["pytest>=8", "pytest-repeat", "ruff", "prometheus_client>=0.17"]

[project.scripts]
circulo = "circulo.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["circulo", "fabrica"]

[tool.setuptools.package-data]
circulo = ["painel.html", "home.html", "integracoes.html", "rastros.html", "fluxo.html", "equipe.html", "aprovacoes.html", "trabalho.html", "DESIGN.md", "jobs_rotulados.json"]
fabrica = ["painel.html", "README.md"]

[tool.ruff.lint.per-file-ignores]
"*.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
