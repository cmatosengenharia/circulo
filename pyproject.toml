[project]
name = "circulo"
version = "1.27.0"
description = "Círculo autoevolutivo Jev First — controle financeiro da família"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
metricas = ["prometheus_client>=0.17"]
dev = ["pytest>=8", "ruff", "prometheus_client>=0.17"]

[project.scripts]
circulo = "circulo.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["circulo"]

[tool.setuptools.package-data]
circulo = ["painel.html", "home.html", "integracoes.html", "rastros.html", "fluxo.html", "jobs_rotulados.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
