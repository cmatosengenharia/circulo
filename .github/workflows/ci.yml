name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    name: Testes (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[dev]" ruff
      - name: Lint
        run: ruff check circulo tests --select E,F,W,B --ignore E501
      - name: Testes
        run: pytest -q
      - name: Pacote instalável leva o painel
        run: |
          pip wheel --no-deps -q -w dist .
          python -m zipfile -l dist/*.whl | grep -q "circulo/home.html"
          python -m zipfile -l dist/*.whl | grep -q "circulo/painel.html"
          echo "wheel ok"
      - name: Diagnóstico roda sem chaves
        run: circulo --data "$RUNNER_TEMP/dg" diagnostico
      - name: Fumaça do loop (50 giros sem input)
        run: |
          circulo --data "$RUNNER_TEMP/d" add "38,90 ifood almoço"
          circulo --data "$RUNNER_TEMP/d" tick -n 50 > ticks.jsonl
          python - <<'EOF'
          import json
          rows = [json.loads(l) for l in open("ticks.jsonl")]
          errs = [e for r in rows for e in r["erros"]]
          assert len(rows) == 50 and not errs, errs
          print("50 giros, 0 erros")
          EOF

  constituicao:
    # Os guardrails, o gate, o orçamento e o CI são a constituição: o loop nunca os altera.
    # Não é uma aprovação pendente: PR de agente que toca neles falha aqui e é recusado na hora.
    name: Constituição
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: PR de agente não altera a constituição
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'circulo/')
        run: |
          # HEAD é o merge do PR na main atual; HEAD^1 é a main atual. Comparar com base.sha (a main de quando o PR
          # abriu) acusava como "do agente" mudanças que entraram na main depois.
          changed=$(git diff --name-only HEAD^1 HEAD -- circulo/merge_gate.py circulo/policy.py circulo/budget.py circulo/guardrails.py circulo/self_dev.py .github/)
          if [ -n "$changed" ]; then echo "::error::Constituição alterada por agente: $changed"; exit 1; fi
          echo "Constituição intacta."
      - name: Fora de PR de agente
        if: "!(github.event_name == 'pull_request' && startsWith(github.head_ref, 'circulo/'))"
        run: echo "Mudança feita por você; o loop não decide sobre a constituição."

  evidencia-reforcada:
    # Código de dinheiro pode mudar sozinho, mas só com propriedades provadas em milhares de casos.
    name: Evidência reforçada
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Quantos casos rodar
        id: n
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE" ] && git diff --name-only "$BASE" HEAD -- circulo/finance.py circulo/money.py | grep -q .; then
            echo "n=5000" >> "$GITHUB_OUTPUT"; echo "Código de dinheiro alterado: evidência reforçada (5000 casos)."
          else
            echo "n=300" >> "$GITHUB_OUTPUT"; echo "Sem mudança em dinheiro: rodada normal (300 casos)."
          fi
      - name: Propriedades financeiras
        env:
          CIRCULO_PROP_N: ${{ steps.n.outputs.n }}
          CIRCULO_PROP_SEED: ${{ github.run_id }}
        run: pytest -q tests/test_propriedades_financeiras.py
